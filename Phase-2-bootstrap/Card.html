<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice Card concept</title>
    </head>
    
    <body>
        <section class="py-5">
            <div class="container">
                <h2 class="text-center fw-bold mb-4">Card</h2>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <span class="badge bg-primary mb-2">Beginner</span>
                                <h5 class="card-title fw-bold">Html</h5>
                                <p class="card-text text-muted">Build the foundation of modern web development from ground zero.</p>
                                <a href="#" class="btn btn-outline-primary w-100">Start Learning</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>


</html>
