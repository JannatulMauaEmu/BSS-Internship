<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Bento Box</title>
        <style>
            .gallery{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 140px 140px 140px;
                gap: 4px;
                width: 600px;
            }

            .gallery img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .img1 {
                grid-row: span 2;
            }
            .img2{
                grid-column: span 2;
            }
            .img4{
                grid-row: span 2;
            }
        </style>
    </head>

    <body>
        <div class="gallery">
            <img class="img1" src="Image1.PNG">
             <img class="img2" src="Image2.PNG">
              <img class="img3" src="Image3.PNG">
               <img class="img4" src="Image4.PNG">
                <img class="img5" src="Image5.PNG">
                 <img class="img6" src="Image6.PNG">
        </div>
    </body>
</html>
