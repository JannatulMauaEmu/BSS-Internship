<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Forms and Table</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body class="bg-light">
        <section class="py-5">
            <div class="container">
                <div class="row gx-5 gy-5">

                    <!--Form Card-->
                    <div class="col-lg-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-success text-white">
                                <h3 class="h5 fw-bold mb-0">Student Registration</h3>
                            </div>
                            <div class="card-body p-4">
                                <form>
                                    <div class="mb-4">
                                        <label for="name" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="name" placeholder="Enter name" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="courseSelect" class="form-label">Select Course</label>
                                        <select class="form-select" id="courseSelect" required>
                                            <option value="" selected>Choose a Course</option>
                                            <option value="1">Bootstrap 5</option>
                                            <option value="2">JavaScript</option>
                                            <option value="3">Python</option>
                                        </select>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!--Table Card-->
                    <div class="col-lg-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-dark text-white">
                                <h3 class="h5 fw-bold mb-0">Registered Students</h3>
                            </div>
                            <div class="card-body p-4">
                                <div class="table-responsive">
                                    <table class="table table-bordered border-dark table-striped table-hover mb-0">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Name</th>
                                                <th>Course</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>Emu</td>
                                                <td>HTML</td>
                                                <td>Active</td>
                                            </tr>
                                            <tr>
                                                <td>Mim</td>
                                                <td>CSS</td>
                                                <td>Inactive</td>
                                            </tr>
                                            <tr>
                                                <td>Mimo</td>
                                                <td>HTML</td>
                                                <td>Active</td>
                                            </tr>
                                            <tr>
                                                <td>Ema</td>
                                                <td>JS</td>
                                                <td>Active</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </body>
</html>
