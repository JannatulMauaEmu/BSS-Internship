<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>List</title>
    </head>
    <body>
        <h2>Unordered List</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
        </ul>

        <h3>Ordered List</h3>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
        </ol>
    </body>
</html>
